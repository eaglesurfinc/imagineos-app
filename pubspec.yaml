name: imagineos
description: A creative studio that preserves children's characters and stories.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.2
  file_selector: 1.1.0
  crypto: 3.0.7
  uuid: 4.6.0
  image: 4.12.0
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/manifest.json
    - assets/fonts/nunito/OFL.txt
    - assets/fonts/patrickhand/OFL.txt
    - assets/fonts/balsamiqsans/OFL.txt
    - assets/fonts/caveat/OFL.txt
    - assets/fonts/fredoka/OFL.txt
    - assets/fonts/comicneue/OFL.txt
    - assets/fonts/lora/OFL.txt
    - assets/fonts/baloo2/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/font.ttf
    - family: Patrick Hand
      fonts:
        - asset: assets/fonts/patrickhand/font.ttf
    - family: Balsamiq Sans
      fonts:
        - asset: assets/fonts/balsamiqsans/font.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat/font.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/font.ttf
    - family: Comic Neue
      fonts:
        - asset: assets/fonts/comicneue/font.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/font.ttf
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/baloo2/font.ttf
