name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      # Only fictional fixtures. No provider or hosted database credentials.
      IMAGINEOS_FLUTTER_SDK_DIR: ${{ runner.temp }}/imagineos-flutter
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed 2026-10-20
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, reviewed 2026-10-20
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install verified Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          source scripts/flutter-sdk.sh
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          flutter --version
      - name: Format, analyze, test and build
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Require the committed dependency lockfile
        shell: bash
        run: git diff --exit-code -- pubspec.lock
      - name: Fingerprint the complete web artifact
        shell: bash
        run: node backend/scripts/release_manifest.mjs > build/release-manifest.json
